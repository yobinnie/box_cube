<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미스터리 큐브 웹사이트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="scene">
        <div class="cube">
            <!-- 6개 면 -->
            <div class="cube-face cube-face-front" id="face-0"></div>
            <div class="cube-face cube-face-back" id="face-1"></div>
            <div class="cube-face cube-face-top" id="face-2"></div>
            <div class="cube-face cube-face-bottom" id="face-3"></div>
            <div class="cube-face cube-face-left" id="face-4"></div>
            <div class="cube-face cube-face-right" id="face-5"></div>
        </div>
    </div>
    <div class="controls">
        <button onclick="move('U')">U (Top)</button>
        <button onclick="move('D')">D (Bottom)</button>
        <button onclick="move('L')">L (Left)</button>
        <button onclick="move('R')">R (Right)</button>
        <button onclick="move('F')">F (Front)</button>
        <button onclick="move('B')">B (Back)</button>
        <button class="action action-scramble" onclick="scramble()">섞기 (Scramble)</button>
        <button class="action action-reset" onclick="resetCube()">리셋</button>
    </div>
    <p id="message">모든 면의 숫자를 통일시키세요!</p>

    <script>
        // 큐브 상태 관리 (6면 x 9칸)
        // 면 순서: 0:앞, 1:뒤, 2:위, 3:아래, 4:왼쪽, 5:오른쪽
        let cubeState = [];
        const faceColors = ['#e74c3c', '#e67e22', '#f1c40f', '#ffffff', '#2ecc71', '#3498db'];
        
        function initCube() {
            cubeState = [];
            for (let i = 0; i < 6; i++) {
                cubeState.push(new Array(9).fill(i));
            }
        }

        function render() {
            for (let f = 0; f < 6; f++) {
                const faceEl = document.getElementById(`face-${f}`);
                faceEl.innerHTML = '';
                for (let s = 0; s < 9; s++) {
                    const val = cubeState[f][s];
                    const sticker = document.createElement('div');
                    sticker.className = 'sticker';
                    sticker.style.backgroundColor = faceColors[val];
                    sticker.textContent = val + 1;
                    faceEl.appendChild(sticker);
                }
            }
            checkWin();
        }

        // 면 자체 회전 (90도 시계방향)
        function rotateFaceData(faceIdx) {
            const f = cubeState[faceIdx];
            const prev = [...f];
            f[0] = prev[6]; f[1] = prev[3]; f[2] = prev[0];
            f[3] = prev[7]; f[4] = prev[4]; f[5] = prev[1];
            f[6] = prev[8]; f[7] = prev[5]; f[8] = prev[2];
        }

        // 실제 큐브 이동 로직 (간소화된 구현)
        function move(type) {
            if (type === 'U') {
                rotateFaceData(2);
                let temp = [cubeState[0][0], cubeState[0][1], cubeState[0][2]];
                [cubeState[0][0], cubeState[0][1], cubeState[0][2]] = [cubeState[5][0], cubeState[5][1], cubeState[5][2]];
                [cubeState[5][0], cubeState[5][1], cubeState[5][2]] = [cubeState[1][0], cubeState[1][1], cubeState[1][2]];
                [cubeState[1][0], cubeState[1][1], cubeState[1][2]] = [cubeState[4][0], cubeState[4][1], cubeState[4][2]];
                [cubeState[4][0], cubeState[4][1], cubeState[4][2]] = temp;
            } else if (type === 'D') {
                rotateFaceData(3);
                let temp = [cubeState[0][6], cubeState[0][7], cubeState[0][8]];
                [cubeState[0][6], cubeState[0][7], cubeState[0][8]] = [cubeState[4][6], cubeState[4][7], cubeState[4][8]];
                [cubeState[4][6], cubeState[4][7], cubeState[4][8]] = [cubeState[1][6], cubeState[1][7], cubeState[1][8]];
                [cubeState[1][6], cubeState[1][7], cubeState[1][8]] = [cubeState[5][6], cubeState[5][7], cubeState[5][8]];
                [cubeState[5][6], cubeState[5][7], cubeState[5][8]] = temp;
            } else if (type === 'R') {
                rotateFaceData(5);
                for(let i of [2,5,8]) {
                    let temp = cubeState[0][i];
                    cubeState[0][i] = cubeState[3][i];
                    cubeState[3][i] = cubeState[1][i];
                    cubeState[1][i] = cubeState[2][i];
                    cubeState[2][i] = temp;
                }
            } else if (type === 'L') {
                rotateFaceData(4);
                for(let i of [0,3,6]) {
                    let temp = cubeState[0][i];
                    cubeState[0][i] = cubeState[2][i];
                    cubeState[2][i] = cubeState[1][i];
                    cubeState[1][i] = cubeState[3][i];
                    cubeState[3][i] = temp;
                }
            } else {
                alert("이동 로직은 F/B를 포함하여 확장 가능합니다. 현재 U,D,L,R이 구현되었습니다.");
            }
            render();
        }

        function scramble() {
            const moves = ['U', 'D', 'L', 'R'];
            for(let i=0; i<15; i++) {
                move(moves[Math.floor(Math.random()*moves.length)]);
            }
            document.getElementById('message').textContent = "큐브가 섞였습니다! 맞춰보세요.";
        }

        function resetCube() {
            initCube();
            render();
            document.getElementById('message').textContent = "리셋되었습니다.";
        }

        function checkWin() {
            let won = true;
            for(let f=0; f<6; f++) {
                if(!cubeState[f].every(v => v === cubeState[f][0])) won = false;
            }
            if(won) document.getElementById('message').textContent = "🎉 축하합니다! 퍼즐을 풀었습니다! 🎉";
        }

        document.addEventListener('DOMContentLoaded', () => {
            const cube = document.querySelector('.cube');
            initCube();
            render();

            // 드래그로 시점 회전 (기존 코드 유지 및 최적화)
            let currentRotationY = -30;
            let currentRotationX = -30;
            let isDragging = false;
            let startX, startY;

            cube.style.transform = `translateZ(-150px) rotateY(${currentRotationY}deg) rotateX(${currentRotationX}deg)`;

            cube.addEventListener('mousedown', (e) => {
                isDragging = true;
                startX = e.clientX; startY = e.clientY;
                cube.style.transition = 'none';
                cube.style.cursor = 'grabbing';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                let dx = e.clientX - startX;
                let dy = e.clientY - startY;
                currentRotationY += dx * 0.5;
                currentRotationX -= dy * 0.5;
                cube.style.transform = `translateZ(-150px) rotateY(${currentRotationY}deg) rotateX(${currentRotationX}deg)`;
                startX = e.clientX; startY = e.clientY;
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    cube.style.transition = 'transform 0.5s ease-out';
                    cube.style.cursor = 'grab';
                }
            });
        });
    </script>
</body>
</html>
